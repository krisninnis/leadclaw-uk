name: Lead Scraper

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run without importing leads"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      limit:
        description: "Maximum leads to discover/import"
        required: true
        default: "5"
      niche_mode:
        description: "Niche mode"
        required: true
        default: "clinic"
        type: choice
        options:
          - clinic
          - local-service
          - custom
      niches:
        description: "Optional space-separated niches for custom runs"
        required: false
        default: ""
      locations:
        description: "Space-separated locations"
        required: true
        default: "London"
      discover_emails:
        description: "Opt in to safe public website email discovery"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      email_discovery_max_pages:
        description: "Maximum safe pages to check during email discovery"
        required: true
        default: "7"

jobs:
  run-scraper:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate scraper
        run: |
          python -m compileall leadclaw-lead-scraper
          python -m unittest discover -s leadclaw-lead-scraper -p "test_*.py"

      - name: Run scraper
        env:
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
          LEAD_IMPORT_TOKEN: ${{ secrets.LEAD_IMPORT_TOKEN }}
          LEADCLAW_IMPORT_URL: ${{ secrets.LEADCLAW_IMPORT_URL }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "schedule" ]; then
            DRY_RUN="false"
            LIMIT="25"
            NICHE_MODE="clinic"
            LOCATIONS="Coventry Birmingham Leicester Nottingham"
            NICHES=""
            DISCOVER_EMAILS="true"
            EMAIL_DISCOVERY_MAX_PAGES="7"
          else
            DRY_RUN="${{ inputs.dry_run }}"
            LIMIT="${{ inputs.limit }}"
            NICHE_MODE="${{ inputs.niche_mode }}"
            LOCATIONS="${{ inputs.locations }}"
            NICHES="${{ inputs.niches }}"
            DISCOVER_EMAILS="${{ inputs.discover_emails }}"
            EMAIL_DISCOVERY_MAX_PAGES="${{ inputs.email_discovery_max_pages }}"
          fi

          ARGS=(
            "--limit" "${LIMIT}"
            "--niche-mode" "${NICHE_MODE}"
            "--locations" ${LOCATIONS}
          )

          if [ -n "${NICHES}" ]; then
            ARGS+=("--niches" ${NICHES})
          fi

          if [ "${DISCOVER_EMAILS}" = "true" ]; then
            ARGS+=("--discover-emails")
            ARGS+=("--email-discovery-max-pages" "${EMAIL_DISCOVERY_MAX_PAGES}")
          fi

          if [ "${DRY_RUN}" = "true" ]; then
            ARGS+=("--dry-run")
          else
            : "${GOOGLE_PLACES_API_KEY:?Missing GOOGLE_PLACES_API_KEY secret}"
            : "${LEAD_IMPORT_TOKEN:?Missing LEAD_IMPORT_TOKEN secret}"
            ARGS+=("--live")
          fi

          python leadclaw-lead-scraper/places_batch.py "${ARGS[@]}"
